<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🧲 Mıknatıs Laboratuvarı - Harfcan</title>
<meta name="description" content="Mıknatıs gücünü ayarla, hangi nesnelerin çekildiğini keşfet! Quiz + deney modu ile eğlenceli fen öğrenme." />
<link rel="canonical" href="https://www.harfcan.com/miknatislab.html" />
<meta property="og:title" content="Mıknatıs Laboratuvarı - Harfcan" />
<meta property="og:description" content="Mıknatıs gücünü ayarla, hangi nesnelerin çekildiğini keşfet! Quiz + deney modu." />
<meta property="og:url" content="https://www.harfcan.com/miknatislab.html" />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://www.harfcan.com/harfcan-logo.png" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; color: #fff; padding: 20px; }
  .container { max-width: 800px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 20px; }
  .logo { display: inline-block; width: 120px; margin-bottom: 10px; }
  .logo img { width: 100%; height: auto; display: block; }
  h1 { text-align: center; font-size: 2rem; margin-bottom: 6px; background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { text-align: center; font-size: 0.95rem; color: #b8b8d4; margin-bottom: 24px; }
  .panel { background: rgba(255,255,255,0.07); backdrop-filter: blur(12px); border-radius: 20px; padding: 24px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
  .hidden { display: none !important; }

  /* Menu */
  .menu-title { font-size: 1.2rem; color: #ccc; margin-bottom: 16px; text-align: center; }
  .mode-buttons { display: flex; gap: 12px; }
  .mode-btn { flex: 1; padding: 16px; font-size: 1rem; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; color: #fff; transition: transform 0.2s; }
  .mode-btn:hover { transform: translateY(-3px); }
  .mode-btn.quiz { background: linear-gradient(135deg, #6c5ce7, #a29bfe); }
  .mode-btn.free { background: linear-gradient(135deg, #00b894, #00cec9); }
  .menu-hint { font-size: 0.8rem; color: #888; text-align: center; margin-top: 12px; }

  /* Quiz */
  .quiz-panel { text-align: center; }
  .quiz-progress { font-size: 0.9rem; color: #888; margin-bottom: 10px; }
  .quiz-emoji { font-size: 5rem; margin: 16px 0; animation: bounce 1.5s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  .quiz-name { font-size: 1.4rem; font-weight: 700; color: #feca57; margin-bottom: 6px; }
  .quiz-question { font-size: 1.1rem; color: #ccc; margin-bottom: 20px; }
  .quiz-buttons { display: flex; gap: 14px; justify-content: center; }
  .quiz-btn { padding: 14px 30px; font-size: 1.1rem; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; color: #fff; transition: transform 0.2s; }
  .quiz-btn:hover { transform: translateY(-3px); }
  .quiz-btn.yes { background: linear-gradient(135deg, #00b894, #00cec9); }
  .quiz-btn.no { background: linear-gradient(135deg, #e17055, #d63031); }
  .quiz-feedback { margin-top: 16px; padding: 10px; border-radius: 10px; font-size: 0.9rem; }
  .quiz-feedback.correct { background: rgba(0,184,148,0.15); color: #55efc4; }
  .quiz-feedback.wrong { background: rgba(225,112,85,0.15); color: #ff7675; }

  /* Strength Slider */
  .strength-label { font-size: 1rem; font-weight: 600; margin-bottom: 10px; display: flex; justify-content: space-between; }
  .strength-value { font-weight: 800; padding: 2px 12px; border-radius: 10px; }
  .slider-track { height: 36px; background: rgba(0,0,0,0.3); border-radius: 18px; overflow: hidden; margin-bottom: 12px; cursor: pointer; }
  .slider-fill { height: 100%; border-radius: 18px; display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; min-width: 36px; transition: width 0.1s; }
  .slider-thumb { width: 26px; height: 26px; background: #fff; border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
  .strength-hints { display: flex; justify-content: space-between; font-size: 0.7rem; color: #888; margin-bottom: 14px; }
  .btn-start { display: block; width: 100%; padding: 14px; font-size: 1.1rem; font-weight: 700; border: none; border-radius: 14px; cursor: pointer; color: #fff; transition: all 0.2s; }
  .btn-start:hover { transform: translateY(-2px); }
  .btn-start.idle { background: linear-gradient(135deg, #00b894, #00cec9); }
  .btn-start.running { background: linear-gradient(135deg, #fdcb6e, #e17055); }
  .btn-start.done { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }

  /* Experiment Table */
  .table-surface { position: relative; width: 100%; height: 320px; background: linear-gradient(180deg, rgba(139,69,19,0.15), rgba(139,69,19,0.25)); border-radius: 16px; border: 2px dashed rgba(255,255,255,0.1); overflow: hidden; margin-top: 16px; }
  .magnet { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); text-align: center; z-index: 10; }
  .magnet-body { width: 50px; height: 90px; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.4); transition: all 0.3s; }
  .pole { display: flex; align-items: center; justify-content: center; height: 50%; font-weight: 900; font-size: 1.1rem; color: #fff; }
  .pole-k { background: linear-gradient(135deg, #e74c3c, #c0392b); }
  .pole-g { background: linear-gradient(135deg, #2980b9, #2471a3); }
  .magnet-label { font-size: 0.65rem; color: #feca57; font-weight: 700; margin-top: 4px; }
  .field-line { position: absolute; height: 2px; border-radius: 1px; animation: fieldPulse 1.5s infinite; }
  @keyframes fieldPulse { 0%{opacity:0.7} 50%{opacity:0.2} 100%{opacity:0.7} }
  .obj { position: absolute; display: flex; flex-direction: column; align-items: center; transition: left 0.06s linear; }
  .obj-emoji { font-size: 2rem; }
  .obj-name { font-size: 0.55rem; background: rgba(0,0,0,0.6); padding: 1px 6px; border-radius: 6px; margin-top: 2px; white-space: nowrap; }
  .obj-info { font-size: 0.5rem; color: #aaa; }
  .obj.attracted .obj-emoji { animation: wobble 0.3s infinite; }
  @keyframes wobble { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} }
  .obj.stuck .obj-emoji { animation: stuckBounce 0.4s; }
  @keyframes stuckBounce { 0%{transform:scale(1)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }

  /* Results */
  .results-title { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }
  .result-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: rgba(255,255,255,0.04); border-radius: 10px; margin-bottom: 6px; font-size: 0.8rem; }
  .result-row .r-emoji { font-size: 1.4rem; }
  .result-row .r-status { margin-left: auto; font-weight: 700; padding: 2px 8px; border-radius: 6px; font-size: 0.7rem; }
  .r-status.yes { background: rgba(0,184,148,0.2); color: #55efc4; }
  .r-status.no { background: rgba(255,118,117,0.2); color: #ff7675; }
  .result-row .r-detail { font-size: 0.7rem; color: #aaa; }
  .quiz-summary { margin-top: 12px; padding: 10px; background: rgba(108,92,231,0.15); border-radius: 10px; font-size: 0.85rem; }
  .fun-fact { margin-top: 14px; padding: 12px 16px; background: linear-gradient(135deg, rgba(108,92,231,0.2), rgba(162,155,254,0.1)); border-radius: 12px; border-left: 4px solid #6c5ce7; font-size: 0.8rem; line-height: 1.5; color: #d4d0ff; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo"><a href="index.html"><img src="harfcan-logo.png" alt="Harfcan Logo" /></a></div>
    <h1>🧲 Mıknatıs Laboratuvarı</h1>
    <p class="subtitle">Mıknatısların nesneleri nasıl çektiğini keşfet!</p>
  </header>

  <!-- Menu -->
  <div class="panel" id="menuScreen">
    <p class="menu-title">Nasıl oynamak istersin?</p>
    <div class="mode-buttons">
      <button class="mode-btn quiz" onclick="startQuiz()">🧠 Quiz + Deney</button>
      <button class="mode-btn free" onclick="startFree()">🔬 Serbest Deney</button>
    </div>
    <p class="menu-hint">Quiz modunda önce tahmin et, sonra deneyle kontrol et!</p>
  </div>

  <!-- Quiz -->
  <div class="panel hidden" id="quizScreen">
    <div class="quiz-panel">
      <div class="quiz-progress" id="quizProgress"></div>
      <div class="quiz-emoji" id="quizEmoji"></div>
      <div class="quiz-name" id="quizName"></div>
      <div class="quiz-question">Bu nesneyi mıknatıs çeker mi?</div>
      <div class="quiz-buttons">
        <button class="quiz-btn yes" onclick="answerQuiz(true)">✓ Evet, çeker</button>
        <button class="quiz-btn no" onclick="answerQuiz(false)">✗ Hayır, çekmez</button>
      </div>
      <div class="quiz-feedback hidden" id="quizFeedback"></div>
    </div>
  </div>

  <!-- Experiment -->
  <div class="panel hidden" id="expScreen">
    <div class="strength-label">
      <span>⚡ Mıknatıs Gücü</span>
      <span class="strength-value" id="strengthValue">50%</span>
    </div>
    <div class="slider-track" id="sliderTrack">
      <div class="slider-fill" id="sliderFill"><div class="slider-thumb"></div></div>
    </div>
    <div class="strength-hints"><span>🪶 Zayıf</span><span>💪 Orta</span><span>🔥 Süper Güçlü</span></div>
    <button class="btn-start idle" id="btnStart" onclick="runExperiment()">🚀 Deneyi Başlat!</button>

    <div class="table-surface" id="tableSurface">
      <div class="magnet" id="magnetEl">
        <div class="magnet-body" id="magnetBody">
          <div class="pole pole-k">K</div>
          <div class="pole pole-g">G</div>
        </div>
        <div class="magnet-label">Mıknatıs</div>
      </div>
    </div>
  </div>

  <!-- Results -->
  <div class="panel hidden" id="resultsScreen">
    <div class="results-title" id="resultsTitle"></div>
    <div id="resultsList"></div>
    <div class="quiz-summary hidden" id="quizSummary"></div>
    <div class="fun-fact" id="funFact"></div>
  </div>
</div>

<script>
// === DATA ===
const OBJECTS = [
  { id:'atac', emoji:'📎', name:'Kağıt Ataç', weight:1, magnetic:true, baseX:140 },
  { id:'igne', emoji:'🪡', name:'İğne', weight:1, magnetic:true, baseX:180 },
  { id:'anahtar', emoji:'🔑', name:'Çelik Anahtar', weight:3, magnetic:true, baseX:260 },
  { id:'makas', emoji:'✂️', name:'Makas', weight:4, magnetic:true, baseX:330 },
  { id:'civi', emoji:'🔩', name:'Çivi', weight:2, magnetic:true, baseX:400 },
  { id:'demirtop', emoji:'⚫', name:'Demir Top', weight:8, magnetic:true, baseX:520 },
  { id:'kalem', emoji:'✏️', name:'Kalem', weight:1, magnetic:false, baseX:160 },
  { id:'tahta', emoji:'🪵', name:'Tahta Parçası', weight:3, magnetic:false, baseX:300 },
  { id:'cam', emoji:'🥛', name:'Cam Bardak', weight:4, magnetic:false, baseX:420 },
  { id:'yaprak', emoji:'🍃', name:'Yaprak', weight:1, magnetic:false, baseX:480 },
];

const FUN_FACTS = [
  "Mıknatıslar demir, nikel ve kobalt gibi metalleri çeker ama tahta, plastik veya bakırı çekmez!",
  "Dünya aslında dev bir mıknatıstır! Pusulalar bu yüzden kuzeyi gösterir.",
  "Güçlü mıknatıslar daha ağır nesneleri ve daha uzaktaki şeyleri çekebilir!",
  "Her mıknatısın iki kutbu vardır: Kuzey (K) ve Güney (G). Zıt kutuplar birbirini çeker!",
  "Bazı mıknatıslar o kadar güçlüdür ki arabaları kaldırabilir! Bunlara elektromıknatıs denir.",
  "Bir mıknatısı ikiye kırarsanız, iki küçük mıknatıs elde edersiniz — her birinin kendi K ve G kutbu olur!",
  "Buzdolabı mıknatısları bilerek zayıf yapılır — sadece kağıt tutacak kadar güçlü!",
  "Hastanelerdeki MR cihazları vücudun içine bakmak için süper güçlü mıknatıslar kullanır!",
];

const MAGNET_X = 70;
const Y_SLOTS = [15, 55, 95, 135, 175, 220, 35, 75, 115, 160];

// === STATE ===
let strength = 50;
let phase = 'idle'; // idle | running | done
let quizIndex = 0;
let quizAnswers = [];
let factIndex = 0;
let animId = null;
let objectEls = [];

// === AUDIO ===
let audioCtx = null;
function getCtx() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
function playTone(freq, dur, type, vol) {
  type = type || 'sine'; vol = vol || 0.2;
  const ctx = getCtx(), osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type; osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + dur);
}
function soundClick() { playTone(500, 0.05, 'sine', 0.15); }
function soundPull() { playTone(200, 0.3); setTimeout(function(){ playTone(350, 0.2); }, 150); }
function soundStick() { playTone(600, 0.1, 'sine', 0.4); setTimeout(function(){ playTone(800, 0.08, 'sine', 0.3); }, 50); }
function soundSuccess() { [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){ playTone(f,0.2,'sine',0.25); }, i*100); }); }

// === HELPERS ===
function getColor(s) { return s<=30?'#55efc4':s<=60?'#feca57':s<=80?'#f39c12':'#e74c3c'; }
function getLabel(s) { return s<=20?'Zayıf':s<=40?'Hafif':s<=60?'Orta':s<=80?'Güçlü':'Süper Güçlü!'; }
function calcRange(s) { return 60 + (s/100) * 500; }
function canPull(s, obj) { return obj.magnetic && s >= obj.weight * 12; }
function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }

// === SLIDER ===
function setupSlider() {
  const track = document.getElementById('sliderTrack');
  function update(e) {
    if (phase === 'running') return;
    const rect = track.getBoundingClientRect();
    const x = (e.clientX || (e.touches && e.touches[0].clientX) || 0) - rect.left;
    strength = Math.max(1, Math.min(100, Math.round((x / rect.width) * 100)));
    renderSlider();
  }
  track.addEventListener('mousedown', function(e) { update(e); track._dragging = true; });
  document.addEventListener('mousemove', function(e) { if (track._dragging) update(e); });
  document.addEventListener('mouseup', function() { track._dragging = false; });
  track.addEventListener('touchstart', update, { passive: true });
  track.addEventListener('touchmove', update, { passive: true });
}

function renderSlider() {
  const color = getColor(strength);
  document.getElementById('sliderFill').style.width = strength + '%';
  document.getElementById('sliderFill').style.background = 'linear-gradient(90deg,' + color + '88,' + color + ')';
  document.getElementById('strengthValue').textContent = strength + '% — ' + getLabel(strength);
  document.getElementById('strengthValue').style.background = color + '30';
  document.getElementById('strengthValue').style.color = color;
}

// === RENDER OBJECTS ===
function renderObjects() {
  const table = document.getElementById('tableSurface');
  // Remove old objects
  objectEls.forEach(function(el) { if (el.parentNode) el.parentNode.removeChild(el); });
  objectEls = [];

  OBJECTS.forEach(function(obj, i) {
    const el = document.createElement('div');
    el.className = 'obj';
    el.id = 'obj-' + obj.id;
    el.style.left = obj.baseX + 'px';
    el.style.top = Y_SLOTS[i] + 'px';
    el.innerHTML = '<div class="obj-emoji">' + obj.emoji + '</div>' +
      '<div class="obj-name">' + obj.name + '</div>' +
      '<div class="obj-info">' + (obj.magnetic ? '⚖️ ' + obj.weight + 'kg' : '🚫 Manyetik değil') + '</div>';
    table.appendChild(el);
    objectEls.push(el);
  });
}

// === MENU ===
function startQuiz() {
  soundClick();
  hide('menuScreen'); show('quizScreen');
  quizIndex = 0; quizAnswers = [];
  renderQuiz();
}

function startFree() {
  soundClick();
  hide('menuScreen'); show('expScreen');
  quizAnswers = [];
  phase = 'idle';
  renderSlider();
  renderObjects();
  updateBtn();
}

// === QUIZ ===
function renderQuiz() {
  const obj = OBJECTS[quizIndex];
  const correct = quizAnswers.filter(function(a){ return a.correct; }).length;
  document.getElementById('quizProgress').textContent = (quizIndex+1) + ' / ' + OBJECTS.length + ' • ✓ ' + correct + ' doğru';
  document.getElementById('quizEmoji').textContent = obj.emoji;
  document.getElementById('quizName').textContent = obj.name;
  hide('quizFeedback');
}

function answerQuiz(guess) {
  soundClick();
  const obj = OBJECTS[quizIndex];
  const correct = (guess === obj.magnetic);
  quizAnswers.push({ obj: obj, guess: guess, correct: correct });

  const fb = document.getElementById('quizFeedback');
  fb.textContent = correct ? '✓ Doğru!' : '✗ Yanlış! ' + (obj.magnetic ? 'Bu nesne manyetik!' : 'Bu nesne manyetik değil!');
  fb.className = 'quiz-feedback ' + (correct ? 'correct' : 'wrong');
  show('quizFeedback');

  setTimeout(function() {
    if (quizIndex < OBJECTS.length - 1) {
      quizIndex++;
      renderQuiz();
    } else {
      hide('quizScreen'); show('expScreen');
      soundSuccess();
      phase = 'idle';
      renderSlider();
      renderObjects();
      updateBtn();
    }
  }, 1000);
}

// === EXPERIMENT ===
function updateBtn() {
  const btn = document.getElementById('btnStart');
  btn.className = 'btn-start ' + phase;
  if (phase === 'idle') btn.textContent = '🚀 Deneyi Başlat!';
  else if (phase === 'running') btn.textContent = '⏳ Mıknatıs çekiyor...';
  else btn.textContent = '🔄 Farklı Güçle Tekrar Dene!';
}

function runExperiment() {
  if (phase === 'running') return;
  if (phase === 'done') {
    phase = 'idle';
    hide('resultsScreen');
    renderObjects();
    updateBtn();
    return;
  }

  phase = 'running';
  updateBtn();
  hide('resultsScreen');

  const range = calcRange(strength);
  const attracted = [];
  OBJECTS.forEach(function(obj) {
    if (canPull(strength, obj) && obj.baseX <= range) attracted.push(obj.id);
  });

  if (attracted.length > 0) soundPull();

  // Show field lines
  const table = document.getElementById('tableSurface');
  var lines = [];
  for (var i = 0; i < 7; i++) {
    var line = document.createElement('div');
    line.className = 'field-line';
    line.style.left = '70px';
    line.style.top = (50 + (i - 3) * 18) + '%';
    line.style.width = (range * 0.6) + 'px';
    var color = getColor(strength);
    line.style.background = 'linear-gradient(90deg,' + color + ',transparent)';
    line.style.animationDelay = (i * 0.15) + 's';
    table.appendChild(line);
    lines.push(line);
  }

  // Magnet glow
  var magnetEl = document.getElementById('magnetEl');
  magnetEl.style.filter = 'drop-shadow(0 0 ' + (strength/5+5) + 'px ' + getColor(strength) + ')';

  var startTime = Date.now();
  var duration = 2000;
  var startPositions = {};
  OBJECTS.forEach(function(obj) {
    var el = document.getElementById('obj-' + obj.id);
    startPositions[obj.id] = parseInt(el.style.left) || obj.baseX;
  });

  var stuckPlayed = {};

  function animate() {
    var progress = Math.min(1, (Date.now() - startTime) / duration);
    var eased = 1 - Math.pow(1 - progress, 3);

    OBJECTS.forEach(function(obj) {
      var el = document.getElementById('obj-' + obj.id);
      if (attracted.indexOf(obj.id) >= 0) {
        var start = startPositions[obj.id];
        var current = start - (start - MAGNET_X) * eased;
        el.style.left = Math.max(MAGNET_X, current) + 'px';
        if (current <= 90) {
          el.className = 'obj stuck';
          if (!stuckPlayed[obj.id]) { soundStick(); stuckPlayed[obj.id] = true; }
        } else {
          el.className = 'obj attracted';
        }
      }
    });

    if (progress < 1) {
      animId = requestAnimationFrame(animate);
    } else {
      // Done
      phase = 'done';
      updateBtn();
      magnetEl.style.filter = 'none';
      lines.forEach(function(l) { l.parentNode.removeChild(l); });
      showResults(attracted);
    }
  }
  animId = requestAnimationFrame(animate);
}

function showResults(attracted) {
  show('resultsScreen');
  var range = calcRange(strength);
  document.getElementById('resultsTitle').textContent = '📊 Deney Sonuçları — Güç: ' + strength + '%';

  var html = '';
  OBJECTS.forEach(function(obj) {
    var pulled = attracted.indexOf(obj.id) >= 0;
    var reason = '';
    if (!obj.magnetic) reason = 'Manyetik malzeme değil';
    else if (strength < obj.weight * 12) reason = 'Güç yetersiz (min: ' + (obj.weight*12) + '%)';
    else if (obj.baseX > range) reason = 'Çok uzakta!';
    else reason = 'Mıknatıs çekti!';

    var quizMark = '';
    if (quizAnswers.length > 0) {
      var qa = quizAnswers.find(function(a){ return a.obj.id === obj.id; });
      if (qa) quizMark = ' <span style="font-size:0.7rem">' + (qa.correct ? '🧠✓' : '🧠✗') + '</span>';
    }

    html += '<div class="result-row">' +
      '<span class="r-emoji">' + obj.emoji + '</span>' +
      '<div><div>' + obj.name + quizMark + '</div><div class="r-detail">' + reason + '</div></div>' +
      '<span class="r-status ' + (pulled ? 'yes' : 'no') + '">' + (pulled ? '✅ Çekildi!' : '❌ Çekilmedi') + '</span>' +
      '</div>';
  });
  document.getElementById('resultsList').innerHTML = html;

  // Quiz summary
  if (quizAnswers.length > 0) {
    var correct = quizAnswers.filter(function(a){ return a.correct; }).length;
    document.getElementById('quizSummary').innerHTML = '🧠 Quiz: <strong>' + correct + '/' + quizAnswers.length + '</strong> doğru tahmin!';
    show('quizSummary');
  }

  // Fun fact
  document.getElementById('funFact').innerHTML = '<strong>🌟 Biliyor muydun?</strong> ' + FUN_FACTS[factIndex];
  factIndex = (factIndex + 1) % FUN_FACTS.length;

  soundSuccess();
}

// === INIT ===
setupSlider();
renderSlider();
</script>
</body>
</html>
