<!doctype html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Tüm İçerikler | Harfcan</title><meta name="description" content="Harfcan oyunlarını, masallarını ve bilim yazılarını tek yerde keşfedin."><link rel="stylesheet" href="harfcan-shell.css"><style>:root{--ink:#20244c;--muted:#656b88;--purple:#6f42d8;--border:#e6e7f0;--shadow:0 12px 30px rgba(55,67,130,.12)}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:linear-gradient(180deg,#eefaff 0,#fffdf7 43%,#fff 100%);font-family:Nunito,"Avenir Next",system-ui,sans-serif}.hero,.content{width:min(100% - 36px,1052px);margin:auto}.hero{padding:47px 0 28px;text-align:center}.eyebrow{margin:0;color:var(--purple);font-size:.75rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase}.hero h1{margin:7px 0 12px;font-size:clamp(2.2rem,5vw,4rem);letter-spacing:-.055em;line-height:1.03}.hero h1 span{color:#ee6b62}.hero p:last-child{max-width:630px;margin:auto;color:#55607e;line-height:1.6}.tools{margin-bottom:22px;padding:18px;border:1px solid var(--border);border-radius:20px;background:#fff;box-shadow:var(--shadow)}.search{width:100%;padding:13px 15px;border:1px solid #cfd2e1;border-radius:13px;color:var(--ink);background:#fbfcff;font:inherit}.filters{display:flex;gap:9px;overflow:auto;margin-top:13px;padding:2px}.filter{white-space:nowrap;border:1px solid #d9daeb;border-radius:999px;padding:.56rem .9rem;color:var(--ink);background:#fff;font:800 .82rem/1 inherit;cursor:pointer}.filter:hover,.filter[aria-pressed=true]{border-color:var(--purple);color:#fff;background:var(--purple)}.summary{margin:0 0 14px;color:var(--muted);font-size:.86rem;font-weight:800}.grid{display:grid;grid-template-columns:1fr;gap:10px;padding-bottom:60px}.card{display:grid;grid-template-columns:58px minmax(0,1fr) auto;align-items:center;gap:13px;min-height:0;padding:13px;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:0 4px 10px rgba(52,64,114,.06);text-decoration:none;color:var(--ink);transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.icon{font-size:2.1rem;text-align:center}.type{display:block;margin:0 0 3px;color:var(--purple);font-size:.67rem;font-weight:900;letter-spacing:.08em}.card h2{margin:0 0 3px;font-size:1rem;line-height:1.2}.card p{margin:0;color:var(--muted);font-size:.81rem;line-height:1.42}.meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:128px;color:#656b88;font-size:.72rem;font-weight:800;text-align:right}.new{color:#286a37}.empty{grid-column:1/-1;padding:36px;border:1px dashed #cfd2e1;border-radius:18px;background:#fff;text-align:center;color:var(--muted)}@media(max-width:800px){.card{grid-template-columns:52px minmax(0,1fr) auto}}@media(max-width:520px){.hero,.content{width:min(100% - 28px,1052px)}.card{grid-template-columns:44px minmax(0,1fr);gap:10px}.meta{grid-column:2;align-items:flex-start;min-width:0;text-align:left}.tools{padding:14px}}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #f18b2b;outline-offset:3px}</style></head>

span class="type">${type==='oyun'?'OYUN':type==='masal'?'MASAL':'BİLİM YAZISI'}</span><h2>${title}</h2><p>${description}</p></div><span class="meta"><span>${isNew?'Yeni eklendi':'Eklendi'}: ${date}</span>${isNew?'<span class="new">● YENİ</span>':''}</span></a>`).join(''):'<div class="empty">Aramanıza uygun bir içerik bulamadık. Başka bir kelime veya tür deneyin.</div>'}document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{active=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(item=>item.setAttribute('aria-pressed',item===button?'true':'false'));render()}));search.addEventListener('input',render);render();</script></body></html>
