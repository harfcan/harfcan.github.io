<!DOCTYPE html>
<html lang="tr">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelime Okuma - Harfcan</title>
  <meta name="description" content="Kelimeyi dinle, doğru yazılışını seç! 60 saniyede kaç kelime bilirsin?" />
  <link rel="canonical" href="https://www.harfcan.com/kelimeler.html" />
  <meta property="og:title" content="Kelime Okuma - Harfcan" />
  <meta property="og:description" content="Kelimeyi dinle, doğru yazılışını seç! 60 saniyede kaç kelime bilirsin?" />
  <meta property="og:url" content="https://www.harfcan.com/kelimeler.html" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://www.harfcan.com/harfcan-logo.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%);
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: #fff;
      margin-bottom: 1.5rem;
    }

    .logo { display: inline-block; width: 120px; margin-bottom: 10px; }
    .logo img { width: 100%; height: auto; display: block; }

    header h1 { font-size: 1.6rem; margin-bottom: 0.3rem; }
    header p { font-size: 0.95rem; opacity: 0.85; }

    .screen {
      background: #fff;
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }

    .start-screen h2 { font-size: 1.4rem; color: #333; margin-bottom: 1rem; }
    .start-screen p { color: #666; margin-bottom: 1.5rem; font-size: 1rem; line-height: 1.6; }

    .start-btn {
      padding: 1rem 3rem;
      background: linear-gradient(135deg, #43cea2, #185a9d);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(67, 206, 162, 0.4);
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .timer {
      font-size: 1.5rem;
      font-weight: 800;
      color: #333;
      background: #f0f0f0;
      padding: 0.4rem 1rem;
      border-radius: 10px;
      min-width: 70px;
      text-align: center;
    }

    .timer.urgent {
      color: #c62828;
      background: #ffebee;
      animation: pulse 0.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .score-display { font-size: 1.1rem; font-weight: 700; color: #185a9d; }
    .streak { font-size: 0.85rem; color: #ff9800; font-weight: 600; min-height: 1.2rem; }

    .listen-area { margin-bottom: 1.5rem; }
    .listen-prompt { font-size: 1.1rem; color: #666; margin-bottom: 1rem; }

    .listen-btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #43cea2, #185a9d);
      color: #fff;
      font-size: 2.5rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(67, 206, 162, 0.3);
    }

    .listen-btn:hover { transform: scale(1.1); }
    .listen-btn:active { transform: scale(0.95); }

    .listen-btn.playing {
      animation: pulseBtn 0.8s ease infinite;
    }

    @keyframes pulseBtn {
      0%, 100% { box-shadow: 0 0 0 0 rgba(67, 206, 162, 0.4); }
      50% { box-shadow: 0 0 0 15px rgba(67, 206, 162, 0); }
    }

    .difficulty-badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      margin-top: 0.8rem;
      font-weight: 600;
    }

    .difficulty-badge.easy { background: #a8e6cf; color: #1b5e20; }
    .difficulty-badge.medium { background: #ffd54f; color: #e65100; }
    .difficulty-badge.hard { background: #ff8a80; color: #b71c1c; }

    .options { display: flex; flex-direction: column; gap: 0.7rem; margin-bottom: 1rem; }

    .option-btn {
      padding: 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      background: #fff;
      transition: all 0.2s;
    }

    .option-btn:hover { border-color: #43cea2; background: #f0fdf4; transform: translateY(-2px); }
    .option-btn.correct { border-color: #2e7d32; background: #e8f5e9; color: #2e7d32; }
    .option-btn.wrong { border-color: #c62828; background: #ffebee; color: #c62828; }
    .option-btn:disabled { cursor: default; opacity: 0.7; }
    .option-btn:disabled:hover { transform: none; border-color: #e0e0e0; background: #fff; }

    .feedback { min-height: 1.5rem; font-weight: 600; font-size: 1.1rem; }
    .feedback.correct { color: #2e7d32; }
    .feedback.wrong { color: #c62828; }

    .word-reveal { font-size: 1.5rem; font-weight: 800; color: #185a9d; min-height: 2rem; margin-bottom: 0.5rem; }

    .end-screen h2 { font-size: 1.5rem; color: #2e7d32; margin-bottom: 0.5rem; }
    .end-screen .big-score { font-size: 4rem; font-weight: 800; color: #185a9d; margin: 0.5rem 0; }
    .end-screen .stats { color: #666; margin-bottom: 1.5rem; font-size: 0.95rem; line-height: 1.8; }
    .end-screen .word-list { text-align: left; background: #f9f9f9; padding: 1rem; border-radius: 10px; margin-bottom: 1.5rem; max-height: 150px; overflow-y: auto; }
    .end-screen .word-list span.cw { display: inline-block; background: #e8f5e9; padding: 0.2rem 0.6rem; border-radius: 6px; margin: 0.2rem; font-size: 0.85rem; color: #2e7d32; }
    .end-screen .word-list span.ww { display: inline-block; background: #ffebee; padding: 0.2rem 0.6rem; border-radius: 6px; margin: 0.2rem; font-size: 0.85rem; color: #c62828; text-decoration: line-through; }

    .play-again-btn {
      padding: 0.8rem 2rem;
      background: linear-gradient(135deg, #43cea2, #185a9d);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .hidden { display: none !important; }

    .countdown-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }

    .countdown-number { font-size: 8rem; font-weight: 900; color: #fff; animation: countPop 0.8s ease; }

    @keyframes countPop {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .celebration { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
    .confetti { position: absolute; border-radius: 50%; animation: fall 1.5s ease-out forwards; }
    @keyframes fall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo"><a href="index.html"><img src="harfcan-logo.png" alt="Harfcan Logo" /></a></div>
      <h1>🔊 Kelime Okuma</h1>
      <p>Dinle ve doğru yazılışı seç!</p>
    </header>

    <!-- Start Screen -->
    <div class="screen start-screen" id="startScreen">
      <h2>⏱️ 60 Saniye Kelime Yarışı!</h2>
      <p>Kelimeyi dinle, doğru yazılışını seç.<br>Kelimeler gittikçe zorlaşıyor!<br><strong>60 saniye</strong> — ne kadar bilirsin?</p>
      <button class="start-btn" onclick="beginCountdown()">🚀 Başla!</button>
    </div>

    <!-- Game Screen -->
    <div class="screen hidden" id="gameScreen">
      <div class="hud">
        <div class="timer" id="timer">60</div>
        <div>
          <div class="score-display">✓ <span id="score">0</span></div>
          <div class="streak" id="streak"></div>
        </div>
      </div>

      <div class="word-reveal" id="wordReveal"></div>

      <div class="listen-area">
        <p class="listen-prompt">Kelimeyi dinle, doğrusunu seç!</p>
        <button class="listen-btn" id="listenBtn" onclick="speakWord()">🔊</button>
        <div class="difficulty-badge easy" id="diffBadge">Kolay</div>
      </div>

      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <!-- End Screen -->
    <div class="screen hidden end-screen" id="endScreen">
      <h2>⏱️ Süre Doldu!</h2>
      <div class="big-score" id="finalScore">0</div>
      <div class="stats" id="stats"></div>
      <div class="word-list" id="wordList"></div>
      <button class="play-again-btn" onclick="restartGame()">🔄 Tekrar Oyna</button>
    </div>
  </div>

  <div class="countdown-overlay hidden" id="countdownOverlay">
    <div class="countdown-number" id="countdownNumber">3</div>
  </div>

  <div class="celebration" id="celebration"></div>

  <script>
    // === WORD DATABASE (easy → hard) ===
    const allWords = [
      // KOLAY - kısa, belirgin farklar
      { word: "Ata", options: ["Ata", "Ana", "Ada"], level: 1 },
      { word: "Ana", options: ["Ana", "Ata", "Ama"], level: 1 },
      { word: "Bal", options: ["Bel", "Bil", "Bal"], level: 1 },
      { word: "Can", options: ["Can", "Cen", "Cin"], level: 1 },
      { word: "El", options: ["El", "Al", "Ol"], level: 1 },
      { word: "Ev", options: ["Ev", "Av", "Öv"], level: 1 },
      { word: "Gül", options: ["Gül", "Gol", "Göl"], level: 1 },
      { word: "Su", options: ["Su", "Sü", "So"], level: 1 },
      { word: "Top", options: ["Top", "Tüp", "Tip"], level: 1 },
      { word: "Yol", options: ["Yol", "Yıl", "Yul"], level: 1 },
      { word: "Kuş", options: ["Kuş", "Kış", "Koş"], level: 1 },
      { word: "Nar", options: ["Nar", "Ner", "Nur"], level: 1 },
      { word: "Fil", options: ["Fil", "Fal", "Ful"], level: 1 },
      { word: "Göz", options: ["Göz", "Güz", "Gez"], level: 1 },
      { word: "Kedi", options: ["Kedi", "Keti", "Kidi"], level: 1 },
      // ORTA - benzer sesli seçenekler
      { word: "Kalem", options: ["Kalem", "Kelem", "Kilem"], level: 2 },
      { word: "Kitap", options: ["Kitap", "Ketap", "Kutap"], level: 2 },
      { word: "Masa", options: ["Masa", "Mese", "Musa"], level: 2 },
      { word: "Baba", options: ["Baba", "Buba", "Bebe"], level: 2 },
      { word: "Deniz", options: ["Deniz", "Doniz", "Daniz"], level: 2 },
      { word: "Limon", options: ["Limon", "Liman", "Limun"], level: 2 },
      { word: "Okul", options: ["Okul", "Akul", "Okil"], level: 2 },
      { word: "Çiçek", options: ["Çiçek", "Çıçak", "Çeçek"], level: 2 },
      { word: "Sabun", options: ["Sabun", "Sabin", "Sebun"], level: 2 },
      { word: "Tavuk", options: ["Tavuk", "Tovuk", "Tuvak"], level: 2 },
      { word: "Balık", options: ["Balık", "Belık", "Bolık"], level: 2 },
      { word: "Bulut", options: ["Bulut", "Bolut", "Bulot"], level: 2 },
      { word: "Mektup", options: ["Mektup", "Maktup", "Mektop"], level: 2 },
      { word: "Nehir", options: ["Nehir", "Nahir", "Nihir"], level: 2 },
      { word: "Orman", options: ["Orman", "Arman", "Ormen"], level: 2 },
      // ZOR - uzun, çok benzer seçenekler
      { word: "Şemsiye", options: ["Şemsiye", "Şamsiye", "Şemsüye"], level: 3 },
      { word: "Tavşan", options: ["Tavşan", "Tavsan", "Tafşan"], level: 3 },
      { word: "Ekmek", options: ["Ekmek", "Ekmak", "Eknek"], level: 3 },
      { word: "Öğretmen", options: ["Öğretmen", "Öğremen", "Ögretmen"], level: 3 },
      { word: "Hayat", options: ["Hayat", "Hayet", "Heyat"], level: 3 },
      { word: "Harita", options: ["Harita", "Harıta", "Harate"], level: 3 },
      { word: "Yıldız", options: ["Yıldız", "Yildiz", "Yılduz"], level: 3 },
      { word: "Rüzgar", options: ["Rüzgar", "Ruzgar", "Rüzgâr"], level: 3 },
      { word: "Hediye", options: ["Hediye", "Hedıye", "Hadiye"], level: 3 },
      { word: "Leylek", options: ["Leylek", "Leylak", "Laylak"], level: 3 },
      { word: "Pirinç", options: ["Pirinç", "Pırinç", "Pirinc"], level: 3 },
      { word: "Sandık", options: ["Sandık", "Sendık", "Sandik"], level: 3 },
      { word: "Zeytin", options: ["Zeytin", "Zeytın", "Zaytin"], level: 3 },
      { word: "Radyo", options: ["Radyo", "Redyo", "Radio"], level: 3 },
      { word: "Vapur", options: ["Vapur", "Vapır", "Vabur"], level: 3 },
    ];

    // === STATE ===
    let gameTimer = null;
    let timeLeft = 60;
    let score = 0;
    let streak = 0;
    let bestStreak = 0;
    let totalAnswered = 0;
    let correctWords = [];
    let wrongWords = [];
    let answered = false;
    let currentLevel = 1;
    let levelStreak = 0;
    let currentWord = null;

    // === AUDIO ===
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function getAudioCtx() { if (!audioCtx) audioCtx = new AudioCtx(); return audioCtx; }

    function playTone(freq, duration, type = 'sine', vol = 0.25) {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    }

    function soundCorrect() {
      playTone(523, 0.12, 'sine', 0.3);
      setTimeout(() => playTone(659, 0.12, 'sine', 0.3), 100);
      setTimeout(() => playTone(784, 0.2, 'sine', 0.3), 200);
    }
    function soundWrong() { playTone(200, 0.25, 'triangle', 0.2); }
    function soundTick() { playTone(1000, 0.05, 'sine', 0.1); }

    // === HELPERS ===
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function getRandomWord() {
      // Mevcut seviyeden rastgele kelime seç
      const pool = allWords.filter(w => w.level === currentLevel);
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function speakWord() {
      if (!currentWord) return;
      const btn = document.getElementById('listenBtn');
      btn.classList.add('playing');
      const utterance = new SpeechSynthesisUtterance(currentWord.word);
      utterance.lang = 'tr-TR';
      utterance.rate = 0.85;
      utterance.onend = () => btn.classList.remove('playing');
      speechSynthesis.cancel();
      speechSynthesis.speak(utterance);
    }

    // === COUNTDOWN ===
    function beginCountdown() {
      document.getElementById('startScreen').classList.add('hidden');
      const overlay = document.getElementById('countdownOverlay');
      const numEl = document.getElementById('countdownNumber');
      overlay.classList.remove('hidden');
      let count = 3;
      numEl.textContent = count;
      soundTick();

      const interval = setInterval(() => {
        count--;
        if (count > 0) {
          numEl.textContent = count;
          numEl.style.animation = 'none';
          void numEl.offsetWidth;
          numEl.style.animation = 'countPop 0.8s ease';
          soundTick();
        } else {
          clearInterval(interval);
          overlay.classList.add('hidden');
          startGame();
        }
      }, 800);
    }

    // === GAME ===
    function startGame() {
      score = 0; streak = 0; bestStreak = 0;
      totalAnswered = 0; correctWords = []; wrongWords = [];
      currentLevel = 1; levelStreak = 0; timeLeft = 60;
      document.getElementById('gameScreen').classList.remove('hidden');
      document.getElementById('score').textContent = '0';
      document.getElementById('streak').textContent = '';
      document.getElementById('timer').textContent = '60';
      document.getElementById('timer').classList.remove('urgent');

      loadWord();
      startTimer();
    }

    function startTimer() {
      gameTimer = setInterval(() => {
        timeLeft--;
        const timerEl = document.getElementById('timer');
        timerEl.textContent = timeLeft;
        if (timeLeft <= 10) { timerEl.classList.add('urgent'); if (timeLeft > 0) soundTick(); }
        if (timeLeft <= 0) { clearInterval(gameTimer); endGame(); }
      }, 1000);
    }

    function getDifficulty() {
      if (currentLevel === 1) return { label: 'Kolay', cls: 'easy' };
      if (currentLevel === 2) return { label: 'Orta', cls: 'medium' };
      return { label: 'Zor', cls: 'hard' };
    }

    function loadWord() {
      answered = false;
      currentWord = getRandomWord();

      document.getElementById('wordReveal').textContent = '';
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';

      const diff = getDifficulty();
      const badge = document.getElementById('diffBadge');
      badge.textContent = diff.label;
      badge.className = `difficulty-badge ${diff.cls}`;

      const shuffledOptions = shuffle(currentWord.options);
      const optionsDiv = document.getElementById('options');
      optionsDiv.innerHTML = '';

      shuffledOptions.forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = option;
        btn.onclick = () => checkAnswer(option, btn);
        optionsDiv.appendChild(btn);
      });

      setTimeout(speakWord, 200);
    }

    function checkAnswer(selected, clickedBtn) {
      if (answered) return;
      answered = true;
      totalAnswered++;

      const wordData = currentWord;
      const buttons = document.querySelectorAll('.option-btn');

      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === wordData.word) btn.classList.add('correct');
      });

      if (selected === wordData.word) {
        const points = currentLevel;
        score += points;
        streak++;
        levelStreak++;
        if (streak > bestStreak) bestStreak = streak;
        correctWords.push(wordData.word);

        clickedBtn.classList.add('correct');
        document.getElementById('score').textContent = score;
        document.getElementById('wordReveal').textContent = `${wordData.word} ✓`;
        document.getElementById('feedback').textContent = `+${points} puan!`;
        document.getElementById('feedback').className = 'feedback correct';
        if (streak >= 3) document.getElementById('streak').textContent = `🔥 ${streak} seri!`;

        // 3 doğru üst üste → seviye atla
        if (levelStreak >= 3 && currentLevel < 3) {
          currentLevel++;
          levelStreak = 0;
          document.getElementById('feedback').textContent = `+${points} 🚀 Seviye atladın!`;
        }

        soundCorrect();
        showMiniCelebration();
      } else {
        streak = 0;
        levelStreak = 0;
        wrongWords.push(wordData.word);
        clickedBtn.classList.add('wrong');
        document.getElementById('streak').textContent = '';
        document.getElementById('wordReveal').textContent = wordData.word;
        document.getElementById('feedback').textContent = 'Yanlış!';
        document.getElementById('feedback').className = 'feedback wrong';
        soundWrong();
      }

      setTimeout(loadWord, 900);
    }

    function endGame() {
      document.getElementById('gameScreen').classList.add('hidden');
      document.getElementById('endScreen').classList.remove('hidden');

      document.getElementById('finalScore').textContent = score;
      const accuracy = totalAnswered > 0 ? Math.round((correctWords.length / totalAnswered) * 100) : 0;
      document.getElementById('stats').innerHTML = `
        ✓ ${correctWords.length} doğru / ${totalAnswered} toplam<br>
        🎯 %${accuracy} doğruluk<br>
        🔥 En uzun seri: ${bestStreak}
      `;

      const listEl = document.getElementById('wordList');
      let html = '';
      correctWords.forEach(w => { html += `<span class="cw">${w} ✓</span> `; });
      wrongWords.forEach(w => { html += `<span class="ww">${w} ✗</span> `; });
      listEl.innerHTML = html || '<span>Henüz kelime yok</span>';
    }

    function restartGame() {
      document.getElementById('endScreen').classList.add('hidden');
      document.getElementById('startScreen').classList.remove('hidden');
    }

    function showMiniCelebration() {
      const container = document.getElementById('celebration');
      const colors = ['#43cea2', '#185a9d', '#a8e6cf', '#ffd54f', '#ff8a80', '#81d4fa'];
      for (let i = 0; i < 12; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + '%';
        c.style.top = '-10px';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.animationDelay = Math.random() * 0.3 + 's';
        c.style.width = (Math.random() * 6 + 4) + 'px';
        c.style.height = c.style.width;
        container.appendChild(c);
      }
      setTimeout(() => { container.innerHTML = ''; }, 1500);
    }
  </script>
</body>
</html>
