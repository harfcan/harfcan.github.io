<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🧲 Magnet Lab - Learn About Magnets!</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    overflow-x: hidden;
    color: #fff;
  }

  .app-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
  }

  h1 {
    text-align: center;
    font-size: 2.4rem;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
  }

  .subtitle {
    text-align: center;
    font-size: 1rem;
    color: #b8b8d4;
    margin-bottom: 24px;
  }

  /* Control Panel */
  .control-panel {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 24px 28px;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .strength-label {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .strength-value {
    font-size: 1.4rem;
    font-weight: 800;
    padding: 2px 14px;
    border-radius: 12px;
    transition: all .3s;
  }

  .slider-track {
    position: relative;
    height: 36px;
    background: rgba(0,0,0,0.3);
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 18px;
    cursor: pointer;
  }

  .slider-fill {
    height: 100%;
    border-radius: 18px;
    transition: width 0.15s ease, background 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 6px;
    min-width: 36px;
  }

  .slider-thumb {
    width: 28px;
    height: 28px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    flex-shrink: 0;
  }

  .strength-hints {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: #8888aa;
    margin-bottom: 16px;
  }

  .btn-start {
    display: block;
    width: 100%;
    padding: 16px;
    font-size: 1.3rem;
    font-weight: 700;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: all .25s;
    letter-spacing: 0.5px;
  }

  .btn-start:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
  .btn-start:active { transform: translateY(0); }

  .btn-start.ready {
    background: linear-gradient(135deg, #00b894, #00cec9);
    color: #fff;
  }

  .btn-start.running {
    background: linear-gradient(135deg, #fdcb6e, #e17055);
    color: #fff;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(225,112,85,0.5); }
    50% { box-shadow: 0 0 0 12px rgba(225,112,85,0); }
  }

  .btn-start.done {
    background: linear-gradient(135deg, #a29bfe, #6c5ce7);
    color: #fff;
  }

  /* Experiment Area */
  .experiment-area {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 20px;
    border: 1px solid rgba(255,255,255,0.08);
    position: relative;
    min-height: 380px;
  }

  .table-surface {
    position: relative;
    width: 100%;
    height: 340px;
    background: linear-gradient(180deg, rgba(139,69,19,0.15), rgba(139,69,19,0.25));
    border-radius: 16px;
    border: 2px dashed rgba(255,255,255,0.1);
    overflow: hidden;
  }

  /* Magnet */
  .magnet {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
    transition: filter 0.3s;
  }

  .magnet-body {
    width: 60px;
    height: 100px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    transition: all 0.3s;
  }

  .magnet-pole {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 1.2rem;
    color: #fff;
  }

  .pole-n { background: linear-gradient(135deg, #e74c3c, #c0392b); }
  .pole-s { background: linear-gradient(135deg, #2980b9, #2471a3); }

  .magnet-label {
    margin-top: 6px;
    font-size: 0.7rem;
    font-weight: 700;
    color: #feca57;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Field lines */
  .field-lines {
    position: absolute;
    left: 80px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
  }

  .field-line {
    position: absolute;
    height: 2px;
    border-radius: 1px;
    opacity: 0;
    transition: opacity 0.5s, width 0.5s;
  }

  .field-line.active {
    animation: fieldPulse 1.5s infinite;
  }

  @keyframes fieldPulse {
    0% { opacity: 0.7; }
    50% { opacity: 0.2; }
    100% { opacity: 0.7; }
  }

  /* Objects */
  .experiment-object {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: left 0.08s linear;
    z-index: 5;
    cursor: default;
  }

  .object-icon {
    font-size: 2.4rem;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
    transition: transform 0.3s;
  }

  .object-label {
    font-size: 0.65rem;
    font-weight: 600;
    background: rgba(0,0,0,0.6);
    padding: 2px 8px;
    border-radius: 8px;
    margin-top: 2px;
    white-space: nowrap;
  }

  .object-weight {
    font-size: 0.55rem;
    color: #aaa;
    margin-top: 1px;
  }

  .attracted .object-icon {
    animation: wobble 0.3s infinite;
  }

  @keyframes wobble {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }

  .stuck .object-icon {
    animation: stuck-bounce 0.4s ease;
  }

  @keyframes stuck-bounce {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  /* Results */
  .results-panel {
    margin-top: 20px;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 20px 24px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .results-title {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .result-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: rgba(255,255,255,0.04);
    border-radius: 12px;
    margin-bottom: 8px;
    font-size: 0.9rem;
  }

  .result-icon { font-size: 1.6rem; }

  .result-status {
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 8px;
    font-size: 0.75rem;
    margin-left: auto;
    flex-shrink: 0;
  }

  .status-attracted {
    background: rgba(0,184,148,0.25);
    color: #55efc4;
  }

  .status-not {
    background: rgba(255,118,117,0.2);
    color: #ff7675;
  }

  .result-detail {
    font-size: 0.75rem;
    color: #aaa;
  }

  /* Fun Fact */
  .fun-fact {
    margin-top: 16px;
    padding: 14px 18px;
    background: linear-gradient(135deg, rgba(108,92,231,0.2), rgba(162,155,254,0.15));
    border-radius: 14px;
    border-left: 4px solid #6c5ce7;
    font-size: 0.85rem;
    line-height: 1.5;
    color: #d4d0ff;
  }

  .fun-fact strong { color: #a29bfe; }

  /* Score */
  .score-bar {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .score-item {
    background: rgba(255,255,255,0.08);
    padding: 8px 20px;
    border-radius: 14px;
    font-size: 0.9rem;
    font-weight: 600;
  }

  .score-item span { font-weight: 800; }

  /* Responsive */
  @media (max-width: 600px) {
    h1 { font-size: 1.6rem; }
    .table-surface { height: 300px; }
    .object-icon { font-size: 1.8rem; }
    .magnet-body { width: 45px; height: 75px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;

const OBJECTS = [
  { id: 'paperclip', emoji: '📎', name: 'Paper Clip', weight: 1, magnetic: true, baseDistance: 140 },
  { id: 'nail',      emoji: '🪡', name: 'Iron Nail',  weight: 2, magnetic: true, baseDistance: 220 },
  { id: 'key',       emoji: '🔑', name: 'Steel Key',  weight: 3, magnetic: true, baseDistance: 300 },
  { id: 'wrench',    emoji: '🔧', name: 'Wrench',     weight: 5, magnetic: true, baseDistance: 400 },
  { id: 'bolt',      emoji: '🔩', name: 'Heavy Bolt',  weight: 7, magnetic: true, baseDistance: 500 },
  { id: 'eraser',    emoji: '🧽', name: 'Eraser',     weight: 2, magnetic: false, baseDistance: 200 },
  { id: 'leaf',      emoji: '🍃', name: 'Leaf',       weight: 1, magnetic: false, baseDistance: 350 },
  { id: 'coin',      emoji: '🪙', name: 'Copper Coin',weight: 3, magnetic: false, baseDistance: 460 },
];

const MAGNET_X = 80;
const STUCK_THRESHOLD = 95;

const FUN_FACTS = [
  "Magnets attract objects made of iron, nickel, and cobalt — but not wood, plastic, or copper!",
  "The Earth is a giant magnet! That's how compasses work — they point to magnetic north.",
  "Stronger magnets can attract heavier objects and pull things from farther away!",
  "Every magnet has two poles: North (N) and South (S). Opposites attract!",
  "Some magnets are so powerful they can lift cars! Those are called electromagnets.",
  "If you break a magnet in half, you get two smaller magnets — each with its own N and S pole!",
  "Refrigerator magnets are weak on purpose — just strong enough to hold paper!",
  "MRI machines in hospitals use super strong magnets to look inside your body!",
];

function getStrengthColor(s) {
  if (s <= 30) return '#55efc4';
  if (s <= 60) return '#feca57';
  if (s <= 80) return '#f39c12';
  return '#e74c3c';
}

function getStrengthLabel(s) {
  if (s <= 20) return 'Weak';
  if (s <= 40) return 'Mild';
  if (s <= 60) return 'Medium';
  if (s <= 80) return 'Strong';
  return 'Super Strong!';
}

function canAttract(strength, obj) {
  if (!obj.magnetic) return { attracted: false, reason: 'Not magnetic material' };
  const pullForce = strength;
  const resistance = obj.weight * 12;
  if (pullForce >= resistance) {
    return { attracted: true, reason: `Magnet strong enough to pull ${obj.name.toLowerCase()}` };
  }
  return { attracted: false, reason: `Need more power! ${obj.name} is too heavy at this strength` };
}

function calcPullRange(strength) {
  return 60 + (strength / 100) * 500;
}

function App() {
  const [strength, setStrength] = useState(30);
  const [phase, setPhase] = useState('idle'); // idle | running | done
  const [objectPositions, setObjectPositions] = useState({});
  const [objectStates, setObjectStates] = useState({});
  const [results, setResults] = useState([]);
  const [experiments, setExperiments] = useState(0);
  const [totalAttracted, setTotalAttracted] = useState(0);
  const [factIndex, setFactIndex] = useState(0);
  const animRef = useRef(null);
  const sliderRef = useRef(null);

  // Initialize positions
  useEffect(() => {
    resetPositions();
  }, []);

  function resetPositions() {
    const pos = {};
    OBJECTS.forEach(obj => {
      pos[obj.id] = obj.baseDistance;
    });
    setObjectPositions(pos);
    setObjectStates({});
  }

  function handleSliderInteraction(e) {
    if (phase === 'running') return;
    const rect = sliderRef.current.getBoundingClientRect();
    const x = (e.clientX || e.touches?.[0]?.clientX || 0) - rect.left;
    const pct = Math.max(1, Math.min(100, Math.round((x / rect.width) * 100)));
    setStrength(pct);
  }

  function startExperiment() {
    if (phase === 'running') return;

    if (phase === 'done') {
      resetPositions();
      setResults([]);
      setPhase('idle');
      return;
    }

    setPhase('running');
    setResults([]);
    const pullRange = calcPullRange(strength);
    const newResults = [];
    const attracted = [];

    OBJECTS.forEach(obj => {
      const check = canAttract(strength, obj);
      const inRange = obj.baseDistance <= pullRange;
      const willMove = check.attracted && inRange;
      newResults.push({
        ...obj,
        willMove,
        reason: !inRange && obj.magnetic
          ? `Too far away! Move the strength up to reach it.`
          : check.reason,
      });
      if (willMove) attracted.push(obj.id);
    });

    // Animate objects
    const startTime = Date.now();
    const duration = 2000;
    const startPositions = { ...objectPositions };
    const states = {};

    function animate() {
      const elapsed = Date.now() - startTime;
      const progress = Math.min(1, elapsed / duration);
      const eased = 1 - Math.pow(1 - progress, 3); // ease out cubic

      const newPos = {};
      const newStates = {};

      OBJECTS.forEach(obj => {
        const start = startPositions[obj.id] || obj.baseDistance;
        if (attracted.includes(obj.id)) {
          const target = MAGNET_X;
          const current = start - (start - target) * eased;
          newPos[obj.id] = Math.max(target, current);
          if (current <= STUCK_THRESHOLD) {
            newStates[obj.id] = 'stuck';
          } else {
            newStates[obj.id] = 'attracted';
          }
        } else {
          newPos[obj.id] = start;
          newStates[obj.id] = 'idle';
        }
      });

      setObjectPositions(newPos);
      setObjectStates(newStates);

      if (progress < 1) {
        animRef.current = requestAnimationFrame(animate);
      } else {
        setPhase('done');
        setResults(newResults);
        setExperiments(prev => prev + 1);
        setTotalAttracted(prev => prev + attracted.length);
        setFactIndex(prev => (prev + 1) % FUN_FACTS.length);
      }
    }

    animRef.current = requestAnimationFrame(animate);
  }

  useEffect(() => {
    return () => {
      if (animRef.current) cancelAnimationFrame(animRef.current);
    };
  }, []);

  const strengthColor = getStrengthColor(strength);
  const strengthText = getStrengthLabel(strength);
  const pullRange = calcPullRange(strength);

  const ySlots = [25, 70, 120, 170, 215, 260, 45, 145];

  return (
    <div className="app-container">
      <h1>🧲 Magnet Lab</h1>
      <p className="subtitle">Discover how magnets attract objects! Adjust the strength and run experiments.</p>

      {experiments > 0 && (
        <div className="score-bar">
          <div className="score-item">🧪 Experiments: <span>{experiments}</span></div>
          <div className="score-item">🧲 Objects Attracted: <span>{totalAttracted}</span></div>
        </div>
      )}

      {/* Controls */}
      <div className="control-panel">
        <div className="strength-label">
          <span>⚡ Magnet Strength</span>
          <span className="strength-value" style={{ background: strengthColor + '30', color: strengthColor }}>
            {strength}% — {strengthText}
          </span>
        </div>

        <div
          className="slider-track"
          ref={sliderRef}
          onMouseDown={handleSliderInteraction}
          onMouseMove={(e) => e.buttons === 1 && handleSliderInteraction(e)}
          onTouchStart={handleSliderInteraction}
          onTouchMove={handleSliderInteraction}
        >
          <div
            className="slider-fill"
            style={{
              width: strength + '%',
              background: `linear-gradient(90deg, ${strengthColor}88, ${strengthColor})`,
            }}
          >
            <div className="slider-thumb" />
          </div>
        </div>

        <div className="strength-hints">
          <span>🪶 Weak</span>
          <span>💪 Medium</span>
          <span>🔥 Super Strong</span>
        </div>

        <button
          className={`btn-start ${phase}`}
          onClick={startExperiment}
          disabled={phase === 'running'}
        >
          {phase === 'idle' && '🚀 Start Experiment!'}
          {phase === 'running' && '⏳ Magnet is pulling...'}
          {phase === 'done' && '🔄 Try Again with Different Strength!'}
        </button>
      </div>

      {/* Experiment Table */}
      <div className="experiment-area">
        <div className="table-surface">
          {/* Magnet */}
          <div className="magnet" style={{
            filter: phase === 'running'
              ? `drop-shadow(0 0 ${strength / 5 + 5}px ${strengthColor})`
              : 'none'
          }}>
            <div className="magnet-body" style={{
              transform: phase === 'running' ? `scale(${1 + strength / 500})` : 'scale(1)',
            }}>
              <div className="magnet-pole pole-n">N</div>
              <div className="magnet-pole pole-s">S</div>
            </div>
            <div className="magnet-label">Magnet</div>
          </div>

          {/* Field lines */}
          {phase === 'running' && (
            <div className="field-lines">
              {[...Array(7)].map((_, i) => {
                const angle = (i - 3) * 12;
                const width = pullRange * 0.65;
                return (
                  <div
                    key={i}
                    className="field-line active"
                    style={{
                      width: width + 'px',
                      top: `${angle}px`,
                      background: `linear-gradient(90deg, ${strengthColor}, transparent)`,
                      animationDelay: `${i * 0.15}s`,
                    }}
                  />
                );
              })}
            </div>
          )}

          {/* Objects */}
          {OBJECTS.map((obj, i) => {
            const left = objectPositions[obj.id] ?? obj.baseDistance;
            const state = objectStates[obj.id] || 'idle';
            const yPos = ySlots[i];
            return (
              <div
                key={obj.id}
                className={`experiment-object ${state}`}
                style={{ left: left + 'px', top: yPos + 'px' }}
              >
                <div className="object-icon">{obj.emoji}</div>
                <div className="object-label">{obj.name}</div>
                <div className="object-weight">
                  {obj.magnetic ? `⚖️ ${obj.weight}kg` : '🚫 Not magnetic'}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Results */}
      {phase === 'done' && results.length > 0 && (
        <div className="results-panel">
          <div className="results-title">📊 Experiment Results — Strength: {strength}%</div>
          {results.map(r => (
            <div className="result-row" key={r.id}>
              <span className="result-icon">{r.emoji}</span>
              <div>
                <div>{r.name}</div>
                <div className="result-detail">{r.reason}</div>
              </div>
              <span className={`result-status ${r.willMove ? 'status-attracted' : 'status-not'}`}>
                {r.willMove ? '✅ Attracted!' : '❌ No effect'}
              </span>
            </div>
          ))}
          <div className="fun-fact">
            <strong>🌟 Fun Fact:</strong> {FUN_FACTS[factIndex]}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
